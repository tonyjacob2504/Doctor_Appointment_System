<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            background: linear-gradient(
                135deg,
                #0F172A 0%,
                #1D4ED8 35%,
                #0F766E 70%,
                #06B6D4 100%
            );

            font-family: Arial, sans-serif;
            padding: 40px 15px;
        }

        /* Main Registration Card */

        .registration-card {
            max-width: 900px;
            margin: auto;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Header */

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .doctor-icon {
            width: 65px;
            height: 65px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #2563EB,
                #06B6D4
            );

            color: white;

            font-size: 30px;

            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .page-header h2 {
            font-weight: 700;
            color: #172033;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748B;
            margin: 0;
        }

        /* Section Heading */

        .section-title {
            font-size: 17px;
            font-weight: 700;

            color: #1E3A8A;

            margin-top: 25px;
            margin-bottom: 20px;

            padding-bottom: 8px;

            border-bottom: 2px solid #E2E8F0;
        }

        /* Labels */

        .form-label {
            font-size: 13px;
            font-weight: 600;

            color: #334155;

            margin-bottom: 7px;
        }

        /* Input */

        .form-control {
            height: 48px;

            border: 1px solid #CBD5E1;

            border-radius: 10px;

            padding: 10px 14px;

            font-size: 14px;

            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #2563EB;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* File input */

        input[type="file"].form-control {
            padding-top: 10px;
        }

        /* Register Button */

        .register-btn {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563EB,
                #06B6D4
            );

            color: white;

            font-size: 16px;

            font-weight: 700;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.35);
        }

        /* Login */

        .login-text {
            text-align: center;

            margin-top: 20px;

            color: #64748B;

            font-size: 14px;
        }

        .login-text a {
            color: #2563EB;

            font-weight: 600;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .registration-card {
                padding: 25px 20px;
            }

            .page-header h2 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

<div class="registration-card">

    <!-- Header -->

    <div class="page-header">

        <div class="doctor-icon">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>

        <h2>Doctor Registration</h2>

        <p>Create your professional doctor account</p>

    </div>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}


        <!-- Personal Information -->

        <div class="section-title">
            <i class="bi bi-person-circle me-2"></i>
            Personal Information
        </div>


        <div class="row">

            <!-- Name -->

            <div class="col-md-6 mb-3">

                <label for="name" class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- Email -->

            <div class="col-md-6 mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Phone -->

            <div class="col-md-6 mb-3">

                <label for="phone" class="form-label">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    required>

            </div>


            <!-- Specialization -->

            <div class="col-md-6 mb-3">

                <label for="specialization" class="form-label">
                    Specialization
                </label>

                <input
                    type="text"
                    id="specialization"
                    name="specialization"
                    class="form-control"
                    placeholder="Example: Cardiology"
                    required>

            </div>


            <!-- Qualification -->

            <div class="col-md-6 mb-3">

                <label for="qualification" class="form-label">
                    Qualification
                </label>

                <input
                    type="text"
                    id="qualification"
                    name="qualification"
                    class="form-control"
                    placeholder="Example: MBBS, MD"
                    required>

            </div>


            <!-- Experience -->

            <div class="col-md-6 mb-3">

                <label for="experience" class="form-label">
                    Experience
                </label>

                <input
                    type="number"
                    id="experience"
                    name="experience"
                    class="form-control"
                    placeholder="Years of experience"
                    required>

            </div>

        </div>


        <!-- Account Information -->

        <div class="section-title">
            <i class="bi bi-shield-lock-fill me-2"></i>
            Account Information
        </div>


        <div class="row">

            <!-- Username -->

            <div class="col-md-6 mb-3">

                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Create username"
                    required>

            </div>


            <!-- Password -->

            <div class="col-md-6 mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Create password"
                    required>

            </div>


            <!-- Photo -->

            <div class="col-12 mb-3">

                <label for="photo" class="form-label">
                    Profile Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    class="form-control"
                    accept="image/*">

            </div>

        </div>


        <!-- Register Button -->

        <div class="mt-4">

            <button
                type="submit"
                class="register-btn">

                <i class="bi bi-person-plus-fill me-2"></i>

                Register Account

            </button>

        </div>


        <!-- Login -->

        <div class="login-text">

            Already registered?

            <a href="/myapp/login/">
                Login
            </a>

        </div>

    </form>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
