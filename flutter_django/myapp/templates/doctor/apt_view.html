<!DOCTYPE html>
<html>
    <head>
        <title>View Appoinment</title>
    </head>
    <body>
        <h2>Appoinments</h2>
        <table border="1">
            <tr>
                <th>No</th>
                <th>doctor</th>
                <th>users</th>
                <th>date</th>
                <th>time</th>
                <th>status</th>
                <th>Action</th>
            </tr> 

            {% for i in data %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.doctors}}</td>
                <td>{{i.users}}</td>
                <td>{{i.date}}</td>
                <td>{{i.time}}</td>
                <td>{{i.status}}</td>
                <td>
                    <a href="" class="btn btn-success">Accept</a>
                    <a href="" class="btn btn-success">Reject</a>
            </tr>
            {%endfor%}
        </table>
    </body>
    </html>
