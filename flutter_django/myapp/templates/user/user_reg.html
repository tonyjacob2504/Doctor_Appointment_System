<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <tittle>User Register</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    </head>
    <body>
        <div class="container mt-5">
            <div class="card shadow mx-auto" style="max-width:600px;">
    <div class="card-body">
        <h2 class="text-center mb-4">User Registration</h2>
    <form method="POST">
        {%csrf_token%}
    <div class="mb-3">
        <label for="name" class="form-label">NAME</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="enter name" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">EMAIL</label>
        <input type="text" id="email" name="email" class="form-control" placeholder="enter email" required>
    </div>

    <div class="mb-3">
        <label for="phone" class="form-label">PHONE</label>
        <input type="text" id="phone" name="phone" class="form-control" placeholder="enter phone" required>
    </div>

    <div class="mb-3">
        <label for="dob" class="form-label">DOB</label>
        <input type="date" id="dob" name="dob" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="gender" class="form-label">GENDER</label>
        <select name="gender" class="form-select" required>
            <option value="">Select Gender</option>
                <option value="male">male</option>
                    <option value="female">Female</option>
                    <option value="others">others</option>
        </select>
            

    </div>
               <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>

            </form>
        </div>
    </div>
</div>
</body>
</html>
