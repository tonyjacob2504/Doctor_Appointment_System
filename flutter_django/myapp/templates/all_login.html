<!DOCTYPE html>
<html>

<head>

    <title>Portal Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;

            font-family: Arial, sans-serif;

            /* DOCTOR RATINGS COLOR COMBINATION */
            background: linear-gradient(
                135deg,
                #FFFBEB 0%,
                #FEF3C7 35%,
                #FAF5FF 70%,
                #F5F3FF 100%
            );
        }


        /* LOGIN CARD */

        .login-box {

            width: 100%;
            max-width: 410px;

            background: #FFFFFF;

            padding: 42px 40px;

            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(76, 58, 99, 0.18);
        }


        /* LOGIN ICON */

        .admin-icon {

            width: 76px;
            height: 76px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #312E4B,
                #4C3A63,
                #7C4D5C,
                #B7791F
            );

            color: #FDE68A;

            font-size: 30px;

            box-shadow:
                0 8px 20px rgba(76, 58, 99, 0.25);
        }


        /* TITLE */

        h2 {

            text-align: center;

            margin: 0 0 8px;

            color: #4C1D5F;

            font-size: 28px;

            font-weight: 700;
        }


        /* SUBTITLE */

        .subtitle {

            text-align: center;

            color: #64748B;

            font-size: 14px;

            margin: 0 0 30px;
        }


        /* LABEL */

        label {

            display: block;

            margin-bottom: 7px;

            color: #5B416B;

            font-size: 14px;

            font-weight: bold;
        }


        /* INPUT */

        input {

            width: 100%;

            height: 49px;

            padding: 10px 15px;

            margin-bottom: 20px;

            border: 1px solid #E9D5FF;

            border-radius: 11px;

            font-size: 14px;

            outline: none;

            background-color: #FAF5FF;

            transition: all 0.25s ease;
        }


        input::placeholder {

            color: #999;
        }


        input:focus {

            border-color: #C084FC;

            background-color: #FFFFFF;

            box-shadow:
                0 0 0 3px rgba(192, 132, 252, 0.15);
        }


        /* LOGIN BUTTON */

        button {

            width: 100%;

            height: 51px;

            padding: 11px;

            border: none;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #312E4B 0%,
                #4C3A63 35%,
                #7C4D5C 70%,
                #B7791F 100%
            );

            color: #FFFFFF;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 18px rgba(76, 58, 99, 0.25);
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(76, 58, 99, 0.35);
        }


        button:active {

            transform: translateY(0);
        }


        /* REGISTER */

        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #64748B;

            font-size: 14px;
        }


        .register-link a {

            color: #7C4D5C;

            text-decoration: none;

            font-weight: bold;
        }


        .register-link a:hover {

            color: #B7791F;

            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-box {

                padding: 32px 23px;

                border-radius: 18px;
            }


            h2 {

                font-size: 24px;
            }


            .admin-icon {

                width: 68px;
                height: 68px;

                font-size: 27px;
            }

        }
        .error-message {

    background: #FEF3C7;

    color: #92400E;

    border: 1px solid #FDE68A;

    border-left: 4px solid #B7791F;

    padding: 12px 14px;

    margin-bottom: 22px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 600;

    text-align: center;
}

    </style>

</head>


<body>


    <div class="login-box">


        <!-- LOGIN ICON -->

        <div class="admin-icon">
            🔐
        </div>


        <!-- TITLE -->

        <h2>Portal Login</h2>


        <p class="subtitle">
            Sign in to access your account
        </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}


        <!-- LOGIN FORM -->

        <form action="" method="POST">

            {% csrf_token %}


            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>


            <button type="submit">
                Login
            </button>


            <p class="register-link">

                New here?

                <a href="/myapp/dregister/">
                    Register
                </a>

            </p>


        </form>


    </div>


</body>

</html>
